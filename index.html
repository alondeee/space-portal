<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: https:;
    connect-src 'self' https://api.nasa.gov;
    base-uri 'self';
    form-action 'self';" />

  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="format-detection" content="telephone=no" />

  <title>Space Educational Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/space-portal-logo/Space-Educational-Portal-Transparent-Background.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
  <main>
    <section class="hero" id="Home">
      <div class="slideshow">
        <div class="slide" style="background-image: url('images/categories/space missions/JWST/JWST.webp')">
        </div>
        <div class="slide" style="background-image: url('images/categories/Nebulas/Lagoon Nebula.jpg')"></div>
        <div class="slide" style="background-image: url('images/categories/Galaxy Clusters/The Perseus Cluster.jpg')">
        </div>

        <button class="slide-arrow prev-arrow">
          <i class="fas fa-chevron-circle-left"></i>
        </button>

        <button class="slide-arrow next-arrow">
          <i class="fas fa-chevron-circle-right"></i>
        </button>

        <div class="slide-dots">
          <span class="dot active" data-slide="0"></span>
          <span class="dot" data-slide="1"></span>
          <span class="dot" data-slide="2"></span>
        </div>
      </div>

      <div class="hero-content">
        <h2>Understanding the Cosmos</h2>
        <p class="subtitle">Cosmic mysteries explained.</p>
      </div>
    </section>


    <!-- <h6 id="top">Back to top</h6> -->
    <a href="#" class="back-to-top">Back to Top</a>
  </main>
  <script src="/js/load-navigation.js"></script>
  <script src="/js/search-index.js"></script>
  <script src="/js/script.js"></script>
</body>

</html>
